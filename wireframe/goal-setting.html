<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - Goal Setting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; }

      /* Hide spin buttons */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Premium Slider Styling */
      .slider-container {
        position: relative;
        height: 32px;
        display: flex;
        align-items: center;
        padding: 0 4px;
      }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 12px;
        background: white;
        border: 1px solid #E2E8F0;
        border-radius: 6px;
        outline: none;
        cursor: pointer;
      }
      
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 0 !important;
        outline: none !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        z-index: 2;
        position: relative;
      }
      input[type='range']::-moz-range-thumb {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 0 !important;
        outline: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        cursor: pointer;
      }

      /* Synchronized Colors - Swapped Protein and Fat */
      #range-cal::-webkit-slider-thumb { background: #8FAE83 !important; }
      #range-pro::-webkit-slider-thumb { background: #A78BFA !important; }
      #range-car::-webkit-slider-thumb { background: #FB923C !important; }
      #range-fat::-webkit-slider-thumb { background: #0EA5E9 !important; }
      
      #range-cal::-moz-range-thumb { background: #8FAE83 !important; }
      #range-pro::-moz-range-thumb { background: #A78BFA !important; }
      #range-car::-moz-range-thumb { background: #FB923C !important; }
      #range-fat::-moz-range-thumb { background: #0EA5E9 !important; }

      .macro-card {
        background: white;
        border-radius: 28px;
        border: 1px solid rgba(0,0,0,0.04);
        box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03);
        padding: 24px;
      }
      .num-input-group {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        width: 140px;
      }
      .num-input {
        background: transparent;
        border: none;
        font-weight: 700;
        text-align: right;
        width: 80px;
        outline: none;
        padding: 0;
        font-size: 24px;
      }
    </style>
  </head>
  <body class="h-screen flex flex-col p-6 overflow-x-hidden">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 px-6">
      <a href="onboarding-name.html" class="size-10 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-slate-800">
        <i data-lucide="chevron-left" class="size-5"></i>
      </a>
      <span class="text-xs font-bold text-slate-400 tracking-widest uppercase">Target 2 / 2</span>
      <div class="size-10"></div>
    </header>

    <!-- Title -->
    <div class="mt-4 mb-8 text-center px-4">
      <h1 class="text-3xl font-bold text-[#1A2E2C] mb-2">Fine-tune your <span class="text-[#8FAE83]">goals</span></h1>
      <p class="text-sm text-slate-500 leading-relaxed">Adjust your daily nutritional targets.</p>
    </div>

    <!-- Sliders Area -->
    <main class="flex-1 space-y-4 pb-10 overflow-y-auto px-4">
      <!-- Calories -->
      <div class="macro-card">
        <div class="flex items-center justify-between mb-4">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Daily Calories</p>
          <div class="num-input-group" style="color: #8FAE83;">
            <input type="number" id="input-cal" value="2450" class="num-input" oninput="updateRange('cal', this.value)">
            <span class="text-xs font-normal text-slate-400 ml-1">kcal</span>
          </div>
        </div>
        <div class="slider-container">
          <input type="range" id="range-cal" min="1200" max="4000" value="2450" oninput="updateInput('cal', this.value)">
        </div>
      </div>

      <!-- Protein (Purple) -->
      <div class="macro-card">
        <div class="flex items-center justify-between mb-4">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Protein</p>
          <div class="num-input-group" style="color: #A78BFA;">
            <input type="number" id="input-pro" value="145" class="num-input" oninput="updateRange('pro', this.value)">
            <span class="text-xs font-normal text-slate-400 ml-1">g</span>
          </div>
        </div>
        <div class="slider-container">
          <input type="range" id="range-pro" min="50" max="250" value="145" oninput="updateInput('pro', this.value)">
        </div>
      </div>

      <!-- Carbs -->
      <div class="macro-card">
        <div class="flex items-center justify-between mb-4">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Carbohydrates</p>
          <div class="num-input-group" style="color: #FB923C;">
            <input type="number" id="input-car" value="280" class="num-input" oninput="updateRange('car', this.value)">
            <span class="text-xs font-normal text-slate-400 ml-1">g</span>
          </div>
        </div>
        <div class="slider-container">
          <input type="range" id="range-car" min="100" max="500" value="280" oninput="updateInput('car', this.value)">
        </div>
      </div>

      <!-- Fat (Blue) -->
      <div class="macro-card">
        <div class="flex items-center justify-between mb-4">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Fat</p>
          <div class="num-input-group" style="color: #0EA5E9;">
            <input type="number" id="input-fat" value="75" class="num-input" oninput="updateRange('fat', this.value)">
            <span class="text-xs font-normal text-slate-400 ml-1">g</span>
          </div>
        </div>
        <div class="slider-container">
          <input type="range" id="range-fat" min="30" max="150" value="75" oninput="updateInput('fat', this.value)">
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="flex justify-center py-10">
      <a href="onboarding-review.html" class="relative size-24 flex items-center justify-center group">
        <svg class="absolute inset-0 size-full" viewBox="0 0 100 100">
          <circle class="text-slate-100" stroke-width="4" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
          <circle class="text-[#8FAE83]" stroke-width="4" stroke-dasharray="282.7" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
        </svg>
        <div class="size-16 rounded-full bg-[#1A2E2C] text-white flex items-center justify-center shadow-2xl transition-transform group-active:scale-95">
          <i data-lucide="chevron-right" class="size-8"></i>
        </div>
      </a>
    </footer>

    <script src="router.js"></script>
    <script>
      lucide.createIcons();

      const colors = {
        'cal': '#8FAE83',
        'pro': '#A78BFA',
        'car': '#FB923C',
        'fat': '#0EA5E9'
      };

      function updateSliderGradient(id, val) {
        const slider = document.getElementById(`range-${id}`);
        const min = slider.min;
        const max = slider.max;
        const percentage = (val - min) / (max - min) * 100;
        slider.style.background = `linear-gradient(to right, ${colors[id]} ${percentage}%, white ${percentage}%)`;
      }

      function updateInput(id, val) {
        document.getElementById(`input-${id}`).value = val;
        updateSliderGradient(id, val);
      }

      function updateRange(id, val) {
        document.getElementById(`range-${id}`).value = val;
        updateSliderGradient(id, val);
      }

      // Initialize
      window.onload = () => {
        ['cal', 'pro', 'car', 'fat'].forEach(id => {
          updateSliderGradient(id, document.getElementById(`range-${id}`).value);
        });
      };
    </script>
  </body>
</html>
