<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - Edit Targets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; color: #1A2E2C; }
      
      /* Remove Spinners (Inc/Dec) for Numbers */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
        appearance: textfield;
      }

      .input-card {
        background: white;
        border-radius: 28px;
        padding: 24px;
        border: 1px solid rgba(0,0,0,0.04);
        box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03);
      }

      /* Premium Slider Styling */
      .slider-container {
        position: relative;
        height: 24px;
        display: flex;
        align-items: center;
        padding: 0 4px;
      }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
        outline: none;
        height: 8px;
      }
      input[type='range']::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: #F1F5F9;
        border-radius: 10px;
        border: none;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        margin-top: -8px; /* Center thumb on track */
        z-index: 5;
        position: relative;
      }
      .num-input {
        background: transparent;
        border: none;
        font-weight: 700;
        text-align: right;
        width: 120px;
        outline: none;
        padding: 0;
        font-size: 28px;
      }
    </style>
  </head>
  <body class="h-screen flex flex-col p-6 overflow-x-hidden">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 px-2">
      <a href="javascript:history.back()" class="size-12 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-slate-800">
        <i data-lucide="chevron-left" class="size-6"></i>
      </a>
      <h1 class="text-xl font-bold">Edit Targets</h1>
      <a href="profile.html" class="size-12 rounded-full bg-[#8FAE83] text-white flex items-center justify-center shadow-lg shadow-[#8FAE83]/30 active:scale-95 transition-all">
        <i data-lucide="check" class="size-6"></i>
      </a>
    </header>

    <main class="flex-1 mt-6 space-y-6 pb-20 overflow-y-auto px-1">
      <p class="text-sm text-slate-400 font-medium px-2">Adjust your daily nutritional goals for automated tracking.</p>

      <!-- Calories -->
      <div class="input-card">
         <div class="flex items-center justify-between mb-4">
             <p class="text-xs font-bold text-slate-400 tracking-wide">Calories</p>
             <div class="flex items-baseline gap-1" style="color: #8FAE83;">
               <input type="number" id="input-cal" value="2450" class="num-input" oninput="updateRange('cal', this.value)">
               <span class="text-xs font-normal text-slate-400">kcal</span>
             </div>
         </div>
         <div class="slider-container">
           <input type="range" id="range-cal" min="800" max="4000" value="2450" oninput="updateInput('cal', this.value)">
         </div>
      </div>

      <!-- Protein -->
      <div class="input-card">
         <div class="flex items-center justify-between mb-4">
             <p class="text-xs font-bold text-slate-400 tracking-wide">Protein</p>
             <div class="flex items-baseline gap-1" style="color: #A78BFA;">
               <input type="number" id="input-pro" value="145" class="num-input" oninput="updateRange('pro', this.value)">
               <span class="text-xs font-normal text-slate-400">grams</span>
             </div>
         </div>
         <div class="slider-container">
           <input type="range" id="range-pro" min="20" max="300" value="145" oninput="updateInput('pro', this.value)">
         </div>
      </div>

      <!-- Carbs -->
      <div class="input-card">
         <div class="flex items-center justify-between mb-4">
             <p class="text-xs font-bold text-slate-400 tracking-wide">Carbohydrates</p>
             <div class="flex items-baseline gap-1" style="color: #FB923C;">
               <input type="number" id="input-car" value="280" class="num-input" oninput="updateRange('car', this.value)">
               <span class="text-xs font-normal text-slate-400">grams</span>
             </div>
         </div>
         <div class="slider-container">
           <input type="range" id="range-car" min="50" max="500" value="280" oninput="inputHandler('car', this.value)">
         </div>
      </div>

      <!-- Fat -->
      <div class="input-card">
         <div class="flex items-center justify-between mb-4">
             <p class="text-xs font-bold text-slate-400 tracking-wide">Fat</p>
             <div class="flex items-baseline gap-1" style="color: #0EA5E9;">
               <input type="number" id="input-fat" value="75" class="num-input" oninput="updateRange('fat', this.value)">
               <span class="text-xs font-normal text-slate-400">grams</span>
             </div>
         </div>
         <div class="slider-container">
           <input type="range" id="range-fat" min="10" max="150" value="75" oninput="updateInput('fat', this.value)">
         </div>
      </div>

    </main>

    <script>
      lucide.createIcons();
      
      const themeColors = {
        'cal': '#8FAE83',
        'pro': '#A78BFA',
        'car': '#FB923C',
        'fat': '#0EA5E9'
      };

      function updateSliderGradient(id, val) {
        const slider = document.getElementById(`range-${id}`);
        const min = slider.min;
        const max = slider.max;
        const percentage = (val - min) / (max - min) * 100;
        // Apply gradient to track directly
        slider.style.backgroundImage = `linear-gradient(90deg, ${themeColors[id]} ${percentage}%, #F1F5F9 ${percentage}%)`;
      }

      function updateInput(id, val) {
        document.getElementById(`input-${id}`).value = val;
        updateSliderGradient(id, val);
      }

      function updateRange(id, val) {
        document.getElementById(`range-${id}`).value = val;
        updateSliderGradient(id, val);
      }

      // Special handler for carbs to catch potential input lag
      function inputHandler(id, val) {
        updateInput(id, val);
      }

      window.onload = () => {
        ['cal', 'pro', 'car', 'fat'].forEach(id => {
          updateSliderGradient(id, document.getElementById(`range-${id}`).value);
        });
      };
    </script>
  </body>
</html>
