<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; color: #1A2E2C; }
      .profile-card {
        background: white;
        border-radius: 28px;
        padding: 24px;
        border: 1px solid rgba(0,0,0,0.04);
        box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03);
      }
      .floating-nav {
        background: #1A2E2C;
        border-radius: 40px;
        box-shadow: 0 10px 30px -5px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col p-6 overflow-x-hidden relative">
    <!-- Header -->
    <header class="py-4 flex items-center justify-between">
      <a href="javascript:history.back()" class="size-12 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-slate-800">
        <i data-lucide="chevron-left" class="size-6"></i>
      </a>
      <h1 class="text-xl font-bold">Profile</h1>
      <div class="size-12"></div> <!-- Spacer -->
    </header>

    <main class="flex-1 space-y-6 mt-6 pb-28">
      
      <!-- Name Card (Premium Style) -->
      <section class="profile-card bg-[#8FAE83]/10 flex items-center justify-between border-none">
        <div class="flex items-center gap-4">
           <div class="size-16 rounded-full overflow-hidden border-2 border-white bg-white shadow-sm">
             <img src="https://ui-avatars.com/api/?name=User&background=8FAE83&color=fff" alt="Avatar">
           </div>
           <div>
             <h2 class="text-xl font-bold">Samantha Ruth</h2>
           </div>
        </div>
      </section>

      <!-- Targets Summary Section -->
      <section class="space-y-4">
         <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest px-2">Daily Targets</h3>
         <div class="profile-card grid grid-cols-2 gap-y-6 gap-x-10">
            <div>
               <p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Calories</p>
               <h4 class="text-lg font-bold text-[#8FAE83]">2,450 <span class="text-[10px] font-normal opacity-50">kcal</span></h4>
            </div>
            <div>
               <p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Protein</p>
               <h4 class="text-lg font-bold text-[#A78BFA]">145 <span class="text-[10px] font-normal opacity-50">g</span></h4>
            </div>
            <div>
               <p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Carbs</p>
               <h4 class="text-lg font-bold text-[#FB923C]">280 <span class="text-[10px] font-normal opacity-50">g</span></h4>
            </div>
            <div>
               <p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Fat</p>
               <h4 class="text-lg font-bold text-[#0EA5E9]">75 <span class="text-[10px] font-normal opacity-50">g</span></h4>
            </div>
         </div>
      </section>

      <!-- Other Options -->
      <section class="space-y-3">
         <a href="profile-edit.html" class="profile-card flex items-center justify-between py-5">
            <div class="flex items-center gap-4">
               <div class="size-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500">
                  <i data-lucide="settings" class="size-5"></i>
               </div>
               <span class="font-bold">Edit Profile</span>
            </div>
            <i data-lucide="chevron-right" class="size-5 text-slate-300"></i>
         </a>

         <div class="profile-card flex items-center justify-between py-5">
            <div class="flex items-center gap-4">
               <div class="size-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500">
                  <i data-lucide="upload" class="size-5"></i>
               </div>
               <span class="font-bold">Import Data</span>
            </div>
            <i data-lucide="chevron-right" class="size-5 text-slate-300"></i>
         </div>

         <div class="profile-card flex items-center justify-between py-5">
            <div class="flex items-center gap-4">
               <div class="size-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500">
                  <i data-lucide="download" class="size-5"></i>
               </div>
               <span class="font-bold">Export Data</span>
            </div>
            <i data-lucide="chevron-right" class="size-5 text-slate-300"></i>
         </div>

         <div class="pt-2 text-center">
           <p class="text-[10px] text-slate-300 uppercase tracking-widest">Version 1.0.4 - Offline Hub</p>
         </div>
      </section>

    </main>

    <!-- Floating Bottom Navigation Bar -->
    <nav class="fixed bottom-6 left-6 right-6 floating-nav p-1 z-50 rounded-2xl">
      <div class="flex items-center justify-around relative">
        <a class="flex flex-col items-center justify-center p-1.5 text-slate-500" href="home.html"><i data-lucide="home" class="size-5"></i></a>
        <a class="flex flex-col items-center justify-center p-1.5 text-slate-500" href="meals.html"><i data-lucide="scroll-text" class="size-5"></i></a>
        <div class="relative">
          <button class="size-11 rounded-full flex items-center justify-center transition-all duration-300 active:scale-95 shadow-md" style="background: #8FAE83; box-shadow: 0 4px 12px -2px rgba(143,174,131,0.5);">
            <i data-lucide="aperture" class="size-6 text-white"></i>
          </button>
        </div>
        <a class="flex flex-col items-center justify-center p-1.5 relative text-slate-500" href="insights.html"><i data-lucide="pie-chart" class="size-5"></i></a>
        <a class="flex flex-col items-center justify-center p-1.5 text-[#8FAE83] relative" href="profile.html">
          <i data-lucide="user" class="size-5"></i>
          <div class="absolute -bottom-1 w-4 h-0.5 bg-[#8FAE83] rounded-full shadow-[0_4px_12px_rgba(143,174,131,0.6)]"></div>
        </a>
      </div>
    </nav>

    <script src="router.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
