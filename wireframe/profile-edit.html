<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; color: #1A2E2C; }
      .input-card {
        background: white;
        border-radius: 28px;
        padding: 24px;
        border: 1px solid rgba(0,0,0,0.04);
        box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .save-btn {
        background: #1A2E2C;
        color: white;
        border-radius: 28px;
        padding: 20px;
        font-weight: 700;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col p-6 overflow-x-hidden relative">
    <!-- Header -->
    <header class="py-4 flex items-center justify-between">
      <a href="javascript:history.back()" class="size-12 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-slate-800">
        <i data-lucide="chevron-left" class="size-6"></i>
      </a>
      <h1 class="text-xl font-bold">Edit Profile</h1>
      <div class="size-12"></div> <!-- Spacer -->
    </header>

    <main class="flex-1 space-y-8 mt-4 pb-10">
      
      <!-- Avatar Section -->
      <div class="flex flex-col items-center gap-4">
        <div class="relative">
           <div class="size-28 rounded-full overflow-hidden border-4 border-white shadow-xl">
              <img src="https://ui-avatars.com/api/?name=User&background=8FAE83&color=fff" class="w-full h-full object-cover">
           </div>
           <button class="absolute bottom-0 right-0 size-9 rounded-full bg-[#1A2E2C] text-white flex items-center justify-center border-4 border-[#F7F9F6]">
              <i data-lucide="camera" class="size-4"></i>
           </button>
        </div>
      </div>

      <!-- General Info -->
      <div class="space-y-4">
        <div class="input-card">
           <div class="size-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400">
              <i data-lucide="user" class="size-5"></i>
           </div>
           <div class="flex-1">
              <p class="text-[10px] uppercase font-bold text-slate-400 mb-0.5">Full Name</p>
              <input type="text" value="Samantha Ruth" class="w-full bg-transparent border-none outline-none font-bold text-[#1A2E2C]">
           </div>
        </div>
      </div>

      <!-- Nutri Targets -->
      <section class="space-y-4">
         <a href="target-edit.html" class="input-card flex justify-between">
            <div class="flex items-center gap-4">
               <div class="size-10 rounded-xl bg-slate-50 flex items-center justify-center text-[#8FAE83]">
                  <i data-lucide="target" class="size-5"></i>
               </div>
               <span class="font-bold">Edit Nutrition Targets</span>
            </div>
            <i data-lucide="chevron-right" class="size-5 text-slate-300"></i>
         </a>
      </section>

      <!-- Advanced Options -->
      <section class="space-y-4 pt-4 border-t border-slate-200">
         <button class="w-full py-4 rounded-3xl border-2 border-red-100 text-red-500 font-bold flex items-center justify-center gap-2 active:bg-red-50 transition-all">
            <i data-lucide="refresh-ccw" class="size-5"></i>
            Reset App Data
         </button>
         <p class="text-[10px] text-center text-slate-400 uppercase tracking-widest">Version 1.0.4 - Premium</p>
      </section>

      <!-- Save Button -->
      <div class="pt-4">
         <button class="save-btn font-bold uppercase tracking-widest" onclick="location.href='profile.html'">
            <span>Save Profile</span>
            <i data-lucide="arrow-right" class="size-5"></i>
         </button>
      </div>

    </main>

    <script>lucide.createIcons();</script>
  </body>
</html>
