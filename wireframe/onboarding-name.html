<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - Name Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; }
      .name-input {
        background: transparent;
        border: 2px solid #E2E8F0;
        border-radius: 32px;
        text-align: center;
        font-weight: 700;
        transition: all 0.3s;
      }
      .name-input:focus {
        border-color: #0F766E;
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
        outline: none;
      }
    </style>
  </head>
  <body class="h-screen flex flex-col p-6 overflow-hidden">
    <!-- Header -->
    <header class="flex justify-between items-center py-4">
      <a href="onboarding-3.html" class="size-10 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-slate-800">
        <i data-lucide="chevron-left" class="size-5"></i>
      </a>
      <span class="text-xs font-bold text-slate-400 tracking-widest uppercase">Target 1 / 2</span>
      <a href="goal-setting.html" class="px-6 py-2.5 rounded-full bg-white text-slate-500 text-sm font-semibold shadow-sm border border-slate-100">Skip</a>
    </header>

    <!-- Content -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 -mt-20">
      <div class="space-y-4 mb-20">
        <h1 class="text-4xl font-bold text-[#1A2E2C]">What is your <span class="text-[#0F766E]">name?</span></h1>
      </div>

      <div class="w-full max-w-[320px]">
        <input type="text" placeholder="Your Name" class="name-input w-full py-8 text-3xl text-[#1A2E2C] placeholder-slate-300">
      </div>
    </main>

    <!-- Footer -->
    <footer class="flex justify-center py-10">
      <a href="goal-setting.html" class="relative size-24 flex items-center justify-center group">
        <svg class="absolute inset-0 size-full" viewBox="0 0 100 100">
          <circle class="text-slate-100" stroke-width="4" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
          <circle class="text-[#0F766E]" stroke-width="4" stroke-dasharray="282.7" stroke-dashoffset="141.3" stroke-linecap="round" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
        </svg>
        <div class="size-16 rounded-full bg-[#1A2E2C] text-white flex items-center justify-center shadow-2xl transition-transform group-active:scale-95">
          <i data-lucide="chevron-right" class="size-8"></i>
        </div>
      </a>
    </footer>

    <script src="router.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
