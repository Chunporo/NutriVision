<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - AI Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background: #000; color: white; margin: 0; height: 100vh; overflow: hidden; }
      
      .scan-bg {
        position: absolute;
        inset: 0;
        background-image: url('https://beefsteak-boiled-potatoes-and-vegetables-on-white-background.webp');
        background-size: cover;
        background-position: center;
        filter: brightness(0.85);
      }

      .scan-line {
        position: absolute;
        top: 30%;
        left: 0;
        right: 0;
        height: 2px;
        background: #8FAE83;
        box-shadow: 0 0 15px 2px #8FAE83;
        animation: scan 3s infinite ease-in-out;
      }
      
      @keyframes scan {
        0%, 100% { top: 30%; opacity: 0.8; }
        50% { top: 60%; opacity: 0.8; }
      }

      .floating-card {
        background: white;
        border-radius: 32px;
        padding: 24px;
        color: #1A2E2C;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        margin: 0 24px 32px 24px;
        position: relative;
        z-index: 20;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    </style>
  </head>
  <body class="flex flex-col justify-between">
    <div class="scan-bg"></div>
    <div class="scan-line"></div>

    <!-- Top Navigation -->
    <header class="relative z-10 flex justify-between items-center p-6 pt-12">
      <a href="javascript:history.back()" class="size-12 rounded-full bg-white/20 backdrop-blur-lg flex items-center justify-center border border-white/30 text-white">
        <i data-lucide="chevron-left" class="size-6"></i>
      </a>
      <h1 class="text-sm font-bold uppercase tracking-widest text-white/80">AI Scanning...</h1>
      <button class="size-12 rounded-full bg-[#FB923C] text-white flex items-center justify-center shadow-lg shadow-orange-500/30">
        <i data-lucide="zap" class="size-6"></i>
      </button>
    </header>

    <!-- Bottom Result Card -->
    <div class="floating-card">
       <div class="flex justify-between items-start mb-4">
          <div>
             <h2 class="text-2xl font-bold text-[#1A2E2C]">Grilled Chicken Breast</h2>
             <p class="text-xs text-slate-400 font-bold mt-1">250g <span class="mx-1">•</span> AI Prediction (98%)</p>
          </div>
          <button class="size-10 rounded-full bg-[#8FAE83]/10 text-[#8FAE83] flex items-center justify-center" onclick="location.href='food-edit.html'">
             <i data-lucide="edit-3" class="size-5"></i>
          </button>
       </div>

       <div class="grid grid-cols-4 gap-2 mb-6">
          <div class="text-[10px] font-bold">
             <span class="dot bg-[#8FAE83]"></span> 342 <span class="text-[8px] text-slate-400 font-normal">cal</span>
          </div>
          <div class="text-[10px] font-bold">
             <span class="dot bg-[#A78BFA]"></span> 31 <span class="text-[8px] text-slate-400 font-normal">pro</span>
          </div>
          <div class="text-[10px] font-bold">
             <span class="dot bg-[#FB923C]"></span> 8 <span class="text-[8px] text-slate-400 font-normal">carb</span>
          </div>
          <div class="text-[10px] font-bold">
             <span class="dot bg-[#0EA5E9]"></span> 18 <span class="text-[8px] text-slate-400 font-normal">fat</span>
          </div>
       </div>

       <div class="flex gap-3">
          <button class="flex-1 py-4 rounded-2xl bg-slate-100 text-slate-500 font-bold text-xs uppercase tracking-widest active:scale-95 transition-all" onclick="history.back()">
             Retake
          </button>
          <button class="flex-[2] py-4 rounded-2xl bg-[#1A2E2C] text-white font-bold text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-all" onclick="savePredictedMeal()">
             Log this meal
          </button>
       </div>
    </div>

    <script src="db.js"></script>
    <script>
      lucide.createIcons();

      function savePredictedMeal() {
         DB.addLog({
            name: "Grilled Chicken Breast",
            kcal: 342,
            icon: "🍗",
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase()
         });
         location.href = 'home.html';
      }
    </script>
  </body>
</html>
