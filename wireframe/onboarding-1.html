<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - Onboarding 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; }
      .progress-ring__circle {
        transition: stroke-dashoffset 0.35s;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
    </style>
  </head>
  <body class="h-screen flex flex-col p-6 overflow-hidden">
    <!-- Header -->
    <header class="flex justify-between items-center py-4">
      <div class="size-10 rounded-xl overflow-hidden shadow-sm border border-slate-200 p-0.5 bg-white">
        <img src="file:///home/ibi/.gemini/antigravity/brain/e7b6109c-9f02-4a4d-98d7-127be659c45c/nutrivision_logo_icon_1774585387825.png" alt="Logo" class="w-full h-full object-cover rounded-lg">
      </div>
      <a href="onboarding-3.html" class="px-6 py-2.5 rounded-full bg-white text-slate-500 text-sm font-semibold shadow-sm border border-slate-100">Skip</a>
    </header>

    <!-- Content -->
    <main class="flex-1 flex flex-col items-center justify-center text-center gap-8 -mt-12">
      <div class="w-full max-w-[280px] aspect-square rounded-[60px] overflow-hidden shadow-xl animate-in slide-in-from-bottom duration-700">
        <img src="file:///home/ibi/.gemini/antigravity/brain/e7b6109c-9f02-4a4d-98d7-127be659c45c/onboarding_breakfast_plate_1774585185167.png" alt="Healthy Eat" class="w-full h-full object-cover">
      </div>
      <div class="space-y-4 px-4 animate-in fade-in duration-1000 delay-300">
        <h2 class="text-3xl font-bold text-[#1A2E2C]">Know What You Eat</h2>
        <p class="text-slate-500 leading-relaxed">Gain insights in your nutritional habits with detailed statistics</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="flex justify-center py-10">
      <a href="onboarding-2.html" class="relative size-20 flex items-center justify-center group">
        <svg class="absolute inset-0 size-full" viewBox="0 0 100 100">
          <circle class="text-slate-100" stroke-width="4" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
          <circle class="text-[#8FAE83] progress-ring__circle" stroke-width="4" stroke-dasharray="282.7" stroke-dashoffset="188.4" stroke-linecap="round" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
        </svg>
        <div class="size-14 rounded-full bg-[#1A2E2C] text-white flex items-center justify-center shadow-lg transition-transform group-active:scale-90">

    <script>lucide.createIcons();</script>
