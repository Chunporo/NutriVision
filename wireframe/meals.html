<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - History Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; color: #1A2E2C; }
      .food-entry {
        background: white;
        border-radius: 20px;
        padding: 16px;
        border: 1px solid rgba(0,0,0,0.04);
        box-shadow: 0 4px 15px -2px rgba(0,0,0,0.02);
        display: flex;
        align-items: center;
        gap: 16px;
        transition: transform 0.2s;
      }
      .floating-nav { background: #1A2E2C; border-radius: 40px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.3); }
    </style>
  </head>
  <body class="min-h-screen flex flex-col p-6 overflow-x-hidden relative">
    <header class="p-6 pb-2">
      <div class="flex items-center justify-between mb-4">
        <button class="size-11 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-[#1A2E2C]" onclick="location.href='food-add.html'">
          <i data-lucide="plus" class="size-5"></i>
        </button>
        <div class="flex flex-col items-center">
           <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tuesday, Oct 24</span>
           <h1 class="text-sm font-bold text-[#1A2E2C]">History Log</h1>
        </div>
        <button class="size-11 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-slate-500" onclick="toggleCalendar()">
          <i data-lucide="calendar" class="size-5"></i>
        </button>
      </div>
      <!-- Calendar Day Strip -->
      <div id="calendar-strip" class="flex justify-between items-center py-2 overflow-x-auto gap-2 no-scrollbar">
         <div class="flex flex-col items-center min-w-[42px] py-3 rounded-2xl bg-white text-slate-400 border border-slate-50"><span class="text-[8px] font-bold uppercase mb-1">Mon</span><span class="text-xs font-bold">23</span></div>
         <div class="flex flex-col items-center min-w-[42px] py-3 rounded-2xl bg-[#8FAE83] text-white shadow-md shadow-[#8FAE83]/20"><span class="text-[8px] font-bold uppercase mb-1">Tue</span><span class="text-xs font-bold">24</span></div>
         <div class="flex flex-col items-center min-w-[42px] py-3 rounded-2xl bg-white text-slate-400 border border-slate-50"><span class="text-[8px] font-bold uppercase mb-1">Wed</span><span class="text-xs font-bold">25</span></div>
         <div class="flex flex-col items-center min-w-[42px] py-3 rounded-2xl bg-white text-slate-400 border border-slate-50"><span class="text-[8px] font-bold uppercase mb-1">Thu</span><span class="text-xs font-bold">26</span></div>
         <div class="flex flex-col items-center min-w-[42px] py-3 rounded-2xl bg-white text-slate-400 border border-slate-50"><span class="text-[8px] font-bold uppercase mb-1">Fri</span><span class="text-xs font-bold">27</span></div>
         <div class="flex flex-col items-center min-w-[42px] py-3 rounded-2xl bg-white text-slate-400 border border-slate-50"><span class="text-[8px] font-bold uppercase mb-1">Sat</span><span class="text-xs font-bold">28</span></div>
         <div class="flex flex-col items-center min-w-[42px] py-3 rounded-2xl bg-white text-slate-400 border border-slate-50"><span class="text-[8px] font-bold uppercase mb-1">Sun</span><span class="text-xs font-bold">29</span></div>
      </div>
    </header>

    <main class="flex-1 space-y-3 mt-8 pb-28" id="history-container">
        <!-- Dynamic Logs from JSON -->
    </main>

    <nav class="fixed bottom-6 left-6 right-6 floating-nav p-1 z-50 rounded-2xl">
      <div class="flex items-center justify-around relative">
        <a class="flex flex-col items-center justify-center p-1.5 text-slate-500" href="home.html"><i data-lucide="home" class="size-5"></i></a>
        <a class="flex flex-col items-center justify-center p-1.5 relative text-[#8FAE83]" href="meals.html">
          <i data-lucide="scroll-text" class="size-5"></i>
          <div class="absolute -bottom-1 w-4 h-0.5 bg-[#8FAE83] rounded-full shadow-[0_4px_12px_rgba(143,174,131,0.6)]"></div>
        </a>
        <div class="relative"><button class="size-11 rounded-full flex items-center justify-center shadow-lg" style="background: #8FAE83;"><i data-lucide="aperture" class="size-6 text-white"></i></button></div>
        <a class="flex flex-col items-center justify-center p-1.5 text-slate-500" href="insights.html"><i data-lucide="pie-chart" class="size-5"></i></a>
        <a class="flex flex-col items-center justify-center p-1.5 text-slate-500" href="profile.html"><i data-lucide="user" class="size-5"></i></a>
      </div>
    </nav>

    <script src="db.js"></script>
    <script src="router.js"></script>
    <script>
      lucide.createIcons();
      function loadHistory() {
          const data = DB.get();
          const container = document.getElementById('history-container');
          container.innerHTML = '';
          data.logs.forEach(log => {
             container.innerHTML += `
                <a href="food-detail.html" class="food-entry active:scale-[0.98]">
                   <div class="size-14 rounded-2xl bg-[#F8FAFC] flex items-center justify-center text-2xl shadow-sm">${log.icon}</div>
                   <div class="flex-1"><h3 class="font-bold text-sm text-[#1A2E2C]">${log.name}</h3></div>
                   <div class="text-right">
                      <p class="text-sm font-bold text-[#1A2E2C]">${log.kcal} <span class="text-[10px] font-normal text-slate-400">kcal</span></p>
                      <p class="text-[10px] font-medium text-slate-400">${log.time}</p>
                   </div>
                </a>
             `;
          });
      }
      loadHistory();
    </script>
  </body>
</html>
