<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - Food Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Public Sans', sans-serif; background-color: #F7F9F6; color: #1A2E2C; }
      .macro-card {
        background: #F8FAFC;
        border-radius: 24px;
        padding: 24px;
        border: 1px solid rgba(0,0,0,0.02);
      }
      .progress-bar-container {
        height: 3px;
        background: #E2E8F0;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 2px;
      }
    </style>
  </head>
  <body class="h-screen flex flex-col p-6 overflow-x-hidden">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 px-2">
      <a href="javascript:history.back()" class="size-12 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100 text-slate-800">
        <i data-lucide="chevron-left" class="size-6"></i>
      </a>
      <a href="food-edit.html" class="size-12 rounded-full bg-[#1A2E2C] flex items-center justify-center shadow-lg text-white">
        <i data-lucide="pencil" class="size-5"></i>
      </a>
    </header>

    <main class="flex-1 mt-4 space-y-8 pb-10">
      <!-- Food Image (On Top of Name) -->
      <div class="w-full px-2">
        <div class="w-full aspect-video rounded-[2.5rem] overflow-hidden shadow-lg border-4 border-white">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1azyRQeUW5SMjZSD_eD72rHLn3SoanU51l7TIg4zfUp8jrQyju8dvtj6M5r9zYBYxjhCqD4a-IsysbVNtDuI73jGYFvaRgUSrlto29ilTtK0yqHJxc1zd7YoGvYNQYshZHfZEUjnSw4x1GYlTrhohEQTU2j-1wFLFUBgX_gByiphI7VqO8B7j66vItzZsW4p0GGv6bltvEoxOJdSp7ljujslP-0ZFX90aUFakqPwFAgSztTlvcupfbj1BEOoLoMEwYbP-NFnurihO" alt="Food" class="w-full h-full object-cover">
        </div>
      </div>

      <!-- Food Title Section -->
      <div class="text-center space-y-2">
        <h2 class="text-3xl font-bold tracking-tight">Avocado Toast</h2>
        <p class="text-slate-400 font-medium text-sm">62g <span class="mx-1 opacity-40">|</span> 8:30 AM</p>
      </div>

      <!-- Nutritional Info Grid -->
      <section class="mt-8">
        <h3 class="text-lg font-bold mb-4 px-2">Nutritional Info</h3>
        <div class="macro-card grid grid-cols-2 gap-x-12 gap-y-10">
          
          <!-- Calories -->
          <div class="space-y-1">
            <div class="flex items-baseline gap-1">
              <span class="text-2xl font-bold">320</span>
              <span class="text-xs text-slate-400 font-medium lowercase">kcal</span>
            </div>
            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Calories</p>
            <div class="progress-bar-container">
              <div class="progress-fill" style="width: 85%; background-color: #8FAE83;"></div>
            </div>
            <p class="text-[10px] text-right text-slate-400 pt-1 font-bold">85%</p>
          </div>

          <!-- Carbs -->
          <div class="space-y-1">
             <div class="flex items-baseline gap-1">
              <span class="text-2xl font-bold">42</span>
              <span class="text-xs text-slate-400 font-medium lowercase">g</span>
            </div>
            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Carbs</p>
            <div class="progress-bar-container">
              <div class="progress-fill" style="width: 32%; background-color: #FB923C;"></div>
            </div>
            <p class="text-[10px] text-right text-slate-400 pt-1 font-bold">32%</p>
          </div>

          <!-- Fat -->
          <div class="space-y-1">
             <div class="flex items-baseline gap-1">
              <span class="text-2xl font-bold">18</span>
              <span class="text-xs text-slate-400 font-medium lowercase">g</span>
            </div>
            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Fat</p>
            <div class="progress-bar-container">
              <div class="progress-fill" style="width: 48%; background-color: #0EA5E9;"></div>
            </div>
            <p class="text-[10px] text-right text-slate-400 pt-1 font-bold">48%</p>
          </div>

          <!-- Protein -->
          <div class="space-y-1">
             <div class="flex items-baseline gap-1">
              <span class="text-2xl font-bold">12</span>
              <span class="text-xs text-slate-400 font-medium lowercase">g</span>
            </div>
            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Protein</p>
            <div class="progress-bar-container">
              <div class="progress-fill" style="width: 52%; background-color: #A78BFA;"></div>
            </div>
            <p class="text-[10px] text-right text-slate-400 pt-1 font-bold">52%</p>
          </div>

        </div>
      </section>
    </main>

    <script src="router.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
