[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutri-vision"
version = "1.0.0"
description = "Food recognition and calorie estimation using ViT and Mask R-CNN"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.36",
    "numpy>=1.24",
    "pandas>=2.1",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.14",
]
app = [
    "streamlit>=1.28",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[project.scripts]
nutri-predict = "scripts.predict:main"
nutri-train = "scripts.train:main"

[tool.setuptools.packages.find]
include = ["nutri_vision*", "scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100
